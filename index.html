    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="./holiday_results/holiday_2022.js"></script>
    <script src="./holiday_results/holiday_2023.js"></script>
    <script src="./holiday_results/holiday_2024.js"></script>
    <script src="./holiday_results/holiday_2025.js"></script>
    <script src="./holiday_results/holiday_2026.js"></script>
</head>

<body>
    <div class="floating-dropdown">
        <button id="templateDropdownBtn" class="floating-btn" title="Export Data Template">
            <span class="btn-icon">⬇️</span>
            <span class="btn-text">Export Template</span>
        </button>
        <div class="dropdown-content" id="templateDropdown">
            <a href="#" id="exportFullTemplate">Full Template (40 Cols)</a>
            <a href="#" id="exportMiniTemplate">Mini Template (3 Cols)</a>
        </div>
    </div>
    <div class="container">
        <h1>ตรวจสอบเรทไฟฟ้าจากไฟล์ Excel</h1>

        <div id="dropArea" class="drop-area">
            <span class="icon">📄</span>
            <p>ลากไฟล์ Excel (.xlsx, .xls) มาวางที่นี่</p>
            <p>หรือคลิกเพื่อเลือกไฟล์</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="monthYearSelector">เลือกเดือน:</label>
                <div class="select-wrapper">
                    <select id="monthYearSelector" onchange="updateDisplay()">
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="arTypeSelector">เลือกประเภท Portion:</label>
                <div class="select-wrapper">
                    <select id="arTypeSelector" onchange="updateDisplay()">
                        <option value="AR1">AR1</option>
                        <option value="AR6">AR6</option>
                        <option value="HA1">HA1</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="unitSelector">เลือกหน่วย:</label>
                <div class="select-wrapper">
                    <select id="unitSelector" onchange="updateDisplay()">
                        <option value="kwh_kvarh">kWh, kVarh</option>
                        <option value="kw_kvar">kW, kVar</option>
                        <option value="voltage_abc">Voltage A, B, C (V)</option>
                        <option value="current_abc">Current A, B, C (A)</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <label for="dataTypeSelector">Import/Export:</label>
                <div class="select-wrapper">
                    <select id="dataTypeSelector" onchange="updateDisplay()">
                        <option value="wh_import">Import</option>
                        <option value="wh_export">Export</option>
                    </select>
                </div>
            </div>

            <div class="control-group checkbox-group">
                <input type="checkbox" id="applyMultiplier" onchange="updateDisplay()">
                <label for="applyMultiplier" class="custom-checkbox">
                    คูณข้อมูลด้วยตัวคูณ
                    <span class="icon-checked">✔</span> <span class="icon-unchecked"></span> </label>
            </div>

            <div class="control-group">
                <button id="exportExcel" class="button">Export Data to Excel</button>
            </div>
        </div>

        <div id="detail-chart-container" class="large-chart-container" style="margin-top: 20px;">
            <canvas id="detailLineChart"></canvas>
        </div>

        <div id="loaderOverlay" class="loader-overlay">
            <div class="spinner"></div>
            <div class="loader-text">กำลังประมวลผล...</div>
        </div>

        <div id="output" class="output-section"></div>
    </div>
    <script>
        const holidays = new Set();
        let globalResults = []; // Stores all raw data from the Excel file
        let isProcessed = false; // Status if file is processed
        let meterNumber = '';

        // monthlySummaries and monthlyMaxValues will now store the data for the CURRENTLY DISPLAYED summary data (all months)
        let monthlySummaries = {};
        let monthlyMaxValues = {};

        let sortState = {
            columnIndex: null,
            direction: 'asc'
        };

        const dropArea = document.getElementById('dropArea');
        const excelFileInput = document.getElementById('excelFile');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('drag-over'), false);
        });

        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                // Reset isProcessed when a new file is dropped
                isProcessed = false;
                excelFileInput.files = files;
                process();
            }
        }

        dropArea.addEventListener('click', () => {
            excelFileInput.click();
        });

        excelFileInput.addEventListener('change', () => {
            if (excelFileInput.files.length > 0) {
                // Reset isProcessed when a new file is selected
                isProcessed = false;
                process();
            }
        });

        // Helper function to extract BKK time components from a UTC-adjusted Date object.
        function getBKKTimeComponents(utcDateObj) {
            return {
                hour: utcDateObj.getUTCHours(),
                minute: utcDateObj.getUTCMinutes(),
                second: utcDateObj.getUTCSeconds(),
                day: utcDateObj.getUTCDate(),
                month: utcDateObj.getUTCMonth(), // 0-indexed
                year: utcDateObj.getUTCFullYear(),
                dayOfWeek: utcDateObj.getUTCDay() // BKK day of week (0=Sun, 6=Sat)
            };
        }

        // Helper function to get a Date object representing midnight of a calendar day in BKK timezone.
        // The returned Date object's UTC components will *directly* represent BKK midnight.
        function getBKKMidnightUTCAdjusted(year, monthIndex, day) { // monthIndex is 0-indexed
            // Create a Date object where its UTC components directly represent BKK midnight for the given day.
            const d = new Date(Date.UTC(year, monthIndex, day, 0, 0, 0));
            return d;
        }

        // ******** ฟังก์ชันสำหรับแปลง Excel Date เป็น BKK Time ในรูปแบบ UTC-adjusted (จุดเดียวที่ปรับ) ********
        function convertExcelDateToBKKUTCAdjusted(rawDate) {
            let dateObj;
            const bkkOffsetMs = 7 * 60 * 60 * 1000; // 7 hours in milliseconds

            if (rawDate instanceof Date) {
                dateObj = new Date(rawDate.getTime() + bkkOffsetMs);
            } else if (typeof rawDate === 'number') {
                const parsed = XLSX.SSF.parse_date_code(rawDate);
                dateObj = new Date(Date.UTC(parsed.y, parsed.m - 1, parsed.d, parsed.H, parsed.M, parsed.S));
            } else if (typeof rawDate === 'string') {
                const match = rawDate.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(\d{1,2}):(\d{2}):(\d{2})|(\d{4})-(\d{1,2})-(\d{1,2})T(\d{1,2}):(\d{2}):(\d{2})/);
                if (match) {
                    let year, month, day, hour, minute, second;
                    if (match[1]) { // DD/MM/YYYY HH:mm:ss format
                        [, day, month, year, hour, minute, second] = match;
                        year = parseInt(year) > 2500 ? parseInt(year) - 543 : parseInt(year); // Convert Buddhist year to AD
                    } else if (match[7]) { //YYYY-MM-DDTHH:mm:ss format
                        [, , , , , , year, month, day, hour, minute, second] = match;
                    }
                    dateObj = new Date(Date.UTC(parseInt(year), parseInt(month) - 1, parseInt(day), parseInt(hour), parseInt(minute), parseInt(second)));
                } else {
                    let tempDate = new Date(rawDate);
                    if (!isNaN(tempDate.getTime())) {
                        dateObj = new Date(tempDate.getTime() + bkkOffsetMs);
                    } else {
                        return null;
                    }
                }
            } else {
                return null;
            }

            return isNaN(dateObj.getTime()) ? null : dateObj;
        }
        // ******************************************************************************

        function collectHolidays() {
            holidays.clear();
            const allHolidayVars = [
                typeof holiday_2022 !== 'undefined' ? holiday_2022 : null,
                typeof holiday_2023 !== 'undefined' ? holiday_2023 : null,
                typeof holiday_2024 !== 'undefined' ? holiday_2024 : null,
                typeof holiday_2025 !== 'undefined' ? holiday_2025 : null,
                typeof holiday_2026 !== 'undefined' ? holiday_2026 : null
            ];
            allHolidayVars.forEach(data => {
                if (!data || !data.data) return;
                data.data.forEach(entry => {
                    if (entry.tou === 1 && entry.holiday) {
                        const [d, m, byear] = entry.holiday.split('/');
                        const year = parseInt(byear) - 543;

                        const bkkHolidayMidnight = getBKKMidnightUTCAdjusted(year, parseInt(m) - 1, parseInt(d));

                        const isoDate = bkkHolidayMidnight.toISOString().split('T')[0];
                        holidays.add(isoDate);
                    }
                });
            });
        }

        function isHoliday(date) {
            let checkDate = new Date(date.getTime());

            const bkkComponents = getBKKTimeComponents(checkDate);
            let hour = bkkComponents.hour;
            let min = bkkComponents.minute;

            if (hour === 0 && min < 15) {
                checkDate.setUTCHours(checkDate.getUTCHours() - 24);
            }

            const finalBkkComponents = getBKKTimeComponents(checkDate);
            const iso = finalBkkComponents.year + '-' +
                String(finalBkkComponents.month + 1).padStart(2, '0') + '-' +
                String(finalBkkComponents.day).padStart(2, '0');
            return holidays.has(iso);
        }

        function getRate(date) {
            let checkDate = new Date(date.getTime());

            const bkkComponents = getBKKTimeComponents(checkDate);
            let hour = bkkComponents.hour;
            let min = bkkComponents.minute;

            if (hour === 0 && min < 15) {
                checkDate.setUTCHours(checkDate.getUTCHours() - 24);
                const adjustedBkkComponents = getBKKTimeComponents(checkDate);
                hour = adjustedBkkComponents.hour;
                min = adjustedBkkComponents.minute;
            }

            const day = getBKKTimeComponents(checkDate).dayOfWeek;
            if (isHoliday(date) || day === 0 || day === 6) {
                return 'Holiday';
            }

            const totalMin = hour * 60 + min;
            const peakStart = 9 * 60 + 15; // 09:15
            const peakEnd = 22 * 60; // 22:00

            if (totalMin >= peakStart && totalMin <= peakEnd) {
                return 'Peak';
            } else {
                return 'Off-peak';
            }
        }

        function getDaysInMonth(year, month) {
            return new Date(Date.UTC(year, month, 0)).getUTCDate();
        }

        function getReadingDay(year, month, arType) { // month is 1-indexed here (1-12)
            const numDaysInMonth = getDaysInMonth(year, month);

            if (arType === 'AR1') {
                return numDaysInMonth - 10;
            } else if (arType === 'AR6') {
                return numDaysInMonth - 2;
            } else if (arType === 'HA1') {
                return 1;
            }
            console.error(`[getReadingDay] Unknown AR Type: ${arType}`);
            return -1;
        }

        function isInBillingPeriod(dateObject, arType, targetMonth, targetYear) {
            let billingPeriodStartDate, billingPeriodEndDate;

            if (arType === 'HA1') {
                billingPeriodStartDate = getBKKMidnightUTCAdjusted(targetYear, targetMonth - 1, 1);
                billingPeriodStartDate.setMinutes(billingPeriodStartDate.getMinutes() + 15);

                let nextMonth = targetMonth + 1;
                let nextMonthYear = targetYear;
                if (nextMonth > 12) {
                    nextMonth = 1;
                    nextMonthYear++;
                }
                billingPeriodEndDate = getBKKMidnightUTCAdjusted(nextMonthYear, nextMonth - 1, 1);

            } else {
                // --- ส่วนที่ปรับปรุงสำหรับ AR1, AR6 ---
                let prevReadingMonth = targetMonth - 1;
                let prevReadingYear = targetYear;
                if (prevReadingMonth === 0) {
                    prevReadingMonth = 12;
                    prevReadingYear--;
                }

                const prevReadingDay = getReadingDay(prevReadingYear, prevReadingMonth, arType);
                if (prevReadingDay === -1) return false;

                // วันเริ่มรอบบิล: วันที่จดหน่วยของเดือนก่อน + 15 นาที (เริ่ม 00:15)
                billingPeriodStartDate = getBKKMidnightUTCAdjusted(prevReadingYear, prevReadingMonth - 1, prevReadingDay);
                billingPeriodStartDate.setMinutes(billingPeriodStartDate.getMinutes() + 15);

                const currentReadingDay = getReadingDay(targetYear, targetMonth, arType);
                if (currentReadingDay === -1) return false;

                // วันสิ้นสุดรอบบิล: วันที่จดหน่วยของเดือนนี้ เวลา 24:00 (หรือ 00:00 ของวันถัดไป)
                let thisMonthReadingDate = getBKKMidnightUTCAdjusted(targetYear, targetMonth - 1, currentReadingDay);
                billingPeriodEndDate = new Date(thisMonthReadingDate.getTime());
                billingPeriodEndDate.setHours(23, 59, 59, 999); // ตั้งให้ครอบคลุมถึงวินาทีสุดท้ายของวันจดหน่วย
            }

            // ตรวจสอบว่าเวลาของข้อมูลอยู่ในช่วงเริ่มและจบของรอบบิลหรือไม่
            return dateObject.getTime() >= billingPeriodStartDate.getTime() &&
                dateObject.getTime() <= billingPeriodEndDate.getTime();
        }

        function sortTable(columnIndex) {
            if (!isProcessed) return;

            if (sortState.columnIndex === columnIndex) {
                sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortState.columnIndex = columnIndex;
                if (columnIndex === 0) { // Datetime
                    sortState.direction = 'asc';
                } else if (columnIndex === 1) { // Rate
                    sortState.direction = 'asc';
                } else { // Numeric columns
                    sortState.direction = 'desc';
                }
            }

            updateDisplay(); // Re-render the detailed table after sorting
        }

        function customRound(value, decimalPlaces) {
            const factor = Math.pow(10, decimalPlaces);
            return Math.round(value * factor) / factor;
        }

        function populateMonthYearSelector() {
            const selector = document.getElementById('monthYearSelector');
            selector.innerHTML = '';

            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

            const uniqueMonthYears = new Set();
            globalResults.forEach(r => {
                const {
                    year,
                    month
                } = getBKKTimeComponents(r.dateObject);
                uniqueMonthYears.add(`${year}-${(month + 1).toString().padStart(2, '0')}`);
            });

            const sortedUniqueMonthYears = Array.from(uniqueMonthYears).sort();

            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = 'แสดงข้อมูลทั้งหมด';
            selector.appendChild(allOption);

            sortedUniqueMonthYears.forEach(periodStr => {
                const [yearStr, monthStr] = periodStr.split('-');
                const year = parseInt(yearStr);
                const month = parseInt(monthStr);

                const option = document.createElement('option');
                option.value = `${year}-${month.toString().padStart(2, '0')}`;
                option.textContent = `${monthNames[month - 1]} ${year + 543}`;
                selector.appendChild(option);
            });

            if (sortedUniqueMonthYears.length > 0) {
                // Set default to the latest month available
                selector.value = sortedUniqueMonthYears[sortedUniqueMonthYears.length - 1];
            }
        }

        function getBillingPeriodDates(selectedYear, selectedMonth, arType) {
            let billingPeriodStartDate, billingPeriodEndDate;

            if (arType === 'HA1') {
                billingPeriodStartDate = getBKKMidnightUTCAdjusted(selectedYear, selectedMonth - 1, 1);
                billingPeriodStartDate.setMinutes(billingPeriodStartDate.getMinutes() + 15);

                let nextMonth = selectedMonth + 1;
                let nextMonthYear = selectedYear;
                if (nextMonth > 12) {
                    nextMonth = 1;
                    nextMonthYear++;
                }
                billingPeriodEndDate = getBKKMidnightUTCAdjusted(nextMonthYear, nextMonth - 1, 1);

            } else {
                let prevReadingMonth = selectedMonth - 1;
                let prevReadingYear = selectedYear;
                if (prevReadingMonth === 0) {
                    prevReadingMonth = 12;
                    prevReadingYear--;
                }

                const prevReadingDay = getReadingDay(prevReadingYear, prevReadingMonth, arType);
                if (prevReadingDay === -1) {
                    console.error(`[getBillingPeriodDates] Failed to get previous reading day for ${prevReadingYear}-${prevReadingMonth}`);
                    return {
                        startDate: null,
                        endDate: null
                    };
                }

                billingPeriodStartDate = getBKKMidnightUTCAdjusted(prevReadingYear, prevReadingMonth - 1, prevReadingDay);
                billingPeriodStartDate.setMinutes(billingPeriodStartDate.getMinutes() + 15);


                const currentReadingDay = getReadingDay(selectedYear, selectedMonth, arType);
                if (currentReadingDay === -1) {
                    console.error(`[getBillingPeriodDates] Could not determine currentReadingDay for ${selectedYear}-${selectedMonth}`);
                    return {
                        startDate: null,
                        endDate: null
                    };
                }

                let thisMonthReadingDate = getBKKMidnightUTCAdjusted(selectedYear, selectedMonth - 1, currentReadingDay);
                billingPeriodEndDate = new Date(thisMonthReadingDate.getTime());
                billingPeriodEndDate.setUTCHours(0);
                billingPeriodEndDate.setUTCMinutes(0);
                billingPeriodEndDate.setUTCSeconds(0);
            }

            return {
                startDate: billingPeriodStartDate,
                endDate: billingPeriodEndDate
            };
        }


        function calculateAllMonthsSummariesAndMaxes(selectedArType, selectedDataType) {
            const calculatedMonthlySummaries = {};
            const calculatedMonthlyMaxValues = {};

            const applyMultiplierForSummaryCalculation = document.getElementById('applyMultiplier').checked;

            const decimalPlacesForKwSummary = 3;

            // First, determine all unique billing months present in the data for the selected AR type
            // --- แก้ไขเป็นแบบนี้ ---
            // ค้นหาบรรทัดที่มีการสร้าง uniqueBillingMonthYears
            const uniqueBillingMonthYears = new Set();
            globalResults.forEach(r => {
                const bkkComponents = getBKKTimeComponents(r.dateObject);

                // 1. เก็บเดือนตามปฏิทินปกติ (ตุลาคม)
                const currentMonthKey = `${bkkComponents.year}-${(bkkComponents.month + 1).toString().padStart(2, '0')}`;
                uniqueBillingMonthYears.add(currentMonthKey);

                // 2. *** ส่วนที่ต้องเพิ่ม ***
                // ถ้าเป็นวันที่ 29 ต.ค. เป็นต้นไป (สำหรับ AR6) ให้สร้างเดือนถัดไป (พฤศจิกายน) รอไว้เลย
                if (bkkComponents.day >= 28) {
                    let nextM = bkkComponents.month + 2;
                    let nextY = bkkComponents.year;
                    if (nextM > 12) { nextM = 1; nextY++; }
                    uniqueBillingMonthYears.add(`${nextY}-${nextM.toString().padStart(2, '0')}`);
                }
            });

            Array.from(uniqueBillingMonthYears).sort().forEach(monthKey => {
                const [yearStr, monthStr] = monthKey.split('-');
                const targetYear = parseInt(yearStr);
                const targetMonth = parseInt(monthStr);

                const { startDate, endDate } = getBillingPeriodDates(targetYear, targetMonth, selectedArType);

                if (!startDate || !endDate) {
                    return;
                }

                calculatedMonthlySummaries[monthKey] = {
                    'Peak': { wh: 0, varh: 0 },
                    'Off-peak': { wh: 0, varh: 0 },
                    'Holiday': { wh: 0, varh: 0 }
                };
                calculatedMonthlyMaxValues[monthKey] = {
                    'Peak': { wh: 0, varh: 0, wh_datetime: '', varh_datetime: '' },
                    'Off-peak': { wh: 0, varh: 0, wh_datetime: '', varh_datetime: '' },
                    'Holiday': { wh: 0, varh: 0, wh_datetime: '', varh_datetime: '' }
                };

                globalResults.forEach(r => {
                    const dateObjectBKK = r.dateObject;
                    if (dateObjectBKK.getTime() >= startDate.getTime() && dateObjectBKK.getTime() <= endDate.getTime()) {
                        const originalWhValue = selectedDataType === 'wh_import' ? r.originalWhImportValue : r.originalWhExportValue;
                        const originalVarhValue = r.originalVarhValue || 0;
                        const rate = getRate(dateObjectBKK);
                        const currentMultiplierForSummaryCalculation = applyMultiplierForSummaryCalculation ? r.rowMultiplier : 1;

                        const wh_sum_value = (originalWhValue * currentMultiplierForSummaryCalculation);
                        const varh_sum_value = (originalVarhValue * currentMultiplierForSummaryCalculation);

                        calculatedMonthlySummaries[monthKey][rate].wh += wh_sum_value;
                        calculatedMonthlySummaries[monthKey][rate].varh += varh_sum_value;

                        // Calculation for kW Max and kVar Max
                        const kW_calculated_base = customRound((Math.round(originalWhValue * 4) * currentMultiplierForSummaryCalculation / 1000), decimalPlacesForKwSummary);
                        const kVar_calculated_base = customRound((Math.round(originalVarhValue * 4) * currentMultiplierForSummaryCalculation / 1000), decimalPlacesForKwSummary);

                        if (kW_calculated_base > calculatedMonthlyMaxValues[monthKey][rate].wh ||
                            (kW_calculated_base === calculatedMonthlyMaxValues[monthKey][rate].wh &&
                                new Date(r.datetime) < new Date(calculatedMonthlyMaxValues[monthKey][rate].wh_datetime))) {
                            calculatedMonthlyMaxValues[monthKey][rate].wh = kW_calculated_base;
                            calculatedMonthlyMaxValues[monthKey][rate].wh_datetime = r.datetime;
                        }
                        if (kVar_calculated_base > calculatedMonthlyMaxValues[monthKey][rate].varh ||
                            (kVar_calculated_base === calculatedMonthlyMaxValues[monthKey][rate].varh &&
                                new Date(r.datetime) < new Date(calculatedMonthlyMaxValues[monthKey][rate].varh_datetime))) {
                            calculatedMonthlyMaxValues[monthKey][rate].varh = kVar_calculated_base;
                            calculatedMonthlyMaxValues[monthKey][rate].varh_datetime = r.datetime;
                        }
                    }
                });
            });

            return { monthlySummaries: calculatedMonthlySummaries, monthlyMaxValues: calculatedMonthlyMaxValues };
        }


        let monthlyCurrentPage = 1;
        const monthlyItemsPerPage = 7; // แสดง 12 เดือนต่อหน้า (ปรับได้)

        function renderMonthlySummaryTable(monthlySummariesToRender, monthlyMaxValuesToRender, selectedDataType) {
            if (!isProcessed || Object.keys(monthlySummariesToRender).length === 0) {
                return `
            <div class="summary-section">
                <h2 class="section-title">สรุปข้อมูลการใช้พลังงานรายเดือน</h2>
                <p>ไม่พบข้อมูลการใช้พลังงานสำหรับประเภท AR ที่เลือก</p>
            </div>
        `;
            }

            const wh_unit = selectedDataType === 'wh_import' ? 'kWh (Import)' : 'kWh (Export)';

            const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            const sortedMonthKeys = Object.keys(monthlySummariesToRender).sort((a, b) => {
                const [yearA, monthA] = a.split('-').map(Number);

                mainSummaryHtml += `

        async function process() {
            if (isProcessed) {
                console.log("File already processed. Skipping re-processing.");
                return;
            }

            // --- 1. แสดง Spinner ---
            const loader = document.getElementById('loaderOverlay');
            loader.style.display = 'flex';

            // ใช้ setTimeout เพื่อให้ UI ทันได้ Render Spinner
            setTimeout(async () => {
                try {
                    collectHolidays();
                    const file = excelFileInput.files[0];
                    if (!file) {
                        alert("กรุณาเลือกไฟล์ Excel");
                        loader.style.display = 'none'; // ปิดถ้าไม่มีไฟล์
                        return;
                    }

                    // ... (โค้ดเดิมของคุณใน process) ...

                    // เมื่อ reader.onload ทำงานเสร็จสิ้นภายในนั้น 
                    // อย่าลืมสั่ง loader.style.display = 'none'; ที่บรรทัดสุดท้ายของ onload ด้วยครับ
                } catch (error) {
                    console.error(error);
                    loader.style.display = 'none';
                }
            }, 100);

            collectHolidays();
            const file = excelFileInput.files[0];
            if (!file) {
                alert("กรุณาเลือกไฟล์ Excel หรือลากไฟล์มาวางก่อนครับ/ค่ะ");
                return;
            }

            dropArea.innerHTML = `<span class="icon" style="color: #28a745;">✅</span><p>ไฟล์ที่เลือก: <strong>${file.name}</strong></p>`;
            document.getElementById('output').innerHTML = '<p>กำลังประมวลผลไฟล์...</p>';


            const reader = new FileReader();
            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {
                    type: 'array',
                    cellDates: true
                });
                const sheet = wb.Sheets[wb.SheetNames[0]];

                let startRowForData = 3;
                let rawDateCol, whImportCol, whExportCol, varhCol;
                let isCompactFormat = false;

                // **************************************************
                // กำหนด Index สำหรับ Voltage A, B, C (เดิม)
                // คอลัมน์ I = Index 8, คอลัมน์ J = Index 9, คอลัมน์ K = Index 10
                // **************************************************
                const voltageACol = 8;
                const voltageBCol = 9;
                const voltageCCol = 10;
                // **************************************************

                // **************************************************
                // ✅ เพิ่ม: กำหนด Index สำหรับ Current A, B, C
                // คอลัมน์ L = Index 11, คอลัมน์ M = Index 12, คอลัมน์ N = Index 13
                // **************************************************
                const currentACol = 11;
                const currentBCol = 12;
                const currentCCol = 13;
                // **************************************************

                const headerRowCompact = XLSX.utils.sheet_to_json(sheet, { header: 1, range: 'A1:C1' })[0];
                // console.log("Header row for compact check:", headerRowCompact); // Commented out for cleaner console

                if (headerRowCompact &&
                    headerRowCompact[0] === 'DATE_M' &&
                    headerRowCompact[1] === 'WH' &&
                    headerRowCompact[2] === 'VARHIMP Total') {

                    console.log("Detected compact format (3 columns).");
                    isCompactFormat = true;
                    startRowForData = 1;
                    rawDateCol = 0;
                    whImportCol = 1;
                    whExportCol = null;
                    varhCol = 2;

                    meterNumber = 'N/A (Compact File)';
                } else {
                    console.log("Detected standard format.");
                    isCompactFormat = false;
                    startRowForData = 3;
                    rawDateCol = 2;
                    whImportCol = 26;
                    whExportCol = 30; // Column AE
                    varhCol = 34;

                    if (sheet['A4'] && sheet['A4'].v !== undefined) {
                        meterNumber = sheet['A4'].v.toString();
                    } else {
                        meterNumber = 'N/A';
                    }
                }


                const rows = XLSX.utils.sheet_to_json(sheet, {
                    header: 1
                });

                globalResults = [];
                isProcessed = false;

                for (let i = startRowForData; i < rows.length; i++) {
                    const rawDate = rows[i][rawDateCol];
                    const originalWhImportValue = parseFloat(rows[i][whImportCol]) || 0;
                    const originalWhExportValue = whExportCol !== null ? parseFloat(rows[i][whExportCol]) || 0 : 0;
                    const originalVarhValue = parseFloat(rows[i][varhCol]) || 0;

                    // **************************************************
                    // โค้ดดึงข้อมูล Voltage (เดิม)
                    // **************************************************
                    let voltageA = 0;
                    let voltageB = 0;
                    let voltageC = 0;

                    // ✅ เพิ่ม: ดึงข้อมูล Current
                    let currentA = 0;
                    let currentB = 0;
                    let currentC = 0;

                    if (!isCompactFormat) {
                        voltageA = parseFloat(rows[i][voltageACol]) || 0; // คอลัมน์ I
                        voltageB = parseFloat(rows[i][voltageBCol]) || 0; // คอลัมน์ J
                        voltageC = parseFloat(rows[i][voltageCCol]) || 0; // คอลัมน์ K

                        // ✅ ดึงข้อมูล Current เมื่อเป็น Standard Format
                        currentA = parseFloat(rows[i][currentACol]) || 0; // คอลัมน์ L (Index 11)

                    // **************************************************

                    let rowMultiplier = 0;

                        const g_val = parseFloat(rows[i][6]) || 0; // Column G (index 6)
                        const h_val = parseFloat(rows[i][7]) || 0; // Column H (index 7)

                }

                isProcessed = true;

            };
            reader.readAsArrayBuffer(file);

        let monthlyIntervalDataForExport = {};

        // 5. Interval Gap Checking Logic (ฟังก์ชันสำหรับหาช่วงเวลาที่หายไป)
        // =========================================================

        // Helper 1: ฟังก์ชันช่วย Format Date object กลับไปเป็น String
        const formatDate = (date) => {
            // PadStart(2, '0') คือการเติม 0 ข้างหน้าถ้าตัวเลขมีหลักเดียว
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${y}/${m}/${d} ${h}:${min}:${s}`;
        };

        // Helper 2: ฟังก์ชันช่วยแปลง String Timestamp เป็น Date Object อย่างแม่นยำ
        const parseDate = (timestampStr) => {
            // ใช้ Regex เพื่อแยกส่วนประกอบของวันที่และเวลา
            const parts = timestampStr.match(/(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
            if (parts) {
                // new Date(year, monthIndex, day, hours, minutes, seconds)
                // Month Index ต้องลบ 1 (เดือน 10 คือ 9)
                return new Date(
                    parseInt(parts[1]), // ปี
                    parseInt(parts[2]) - 1, // เดือน (0-based)
                    parseInt(parts[3]), // วัน
                    parseInt(parts[4]), // ชั่วโมง
                    parseInt(parts[5]), // นาที
                    parseInt(parts[6]) // วินาที
                );
            }
            return null;
        };

        function findIntervalGaps(timestampData) {
            if (timestampData.length === 0) return [];

            // เรียงลำดับเพื่อให้แน่ใจว่าการตรวจสอบเป็นไปตามลำดับเวลา
            const sortedData = [...timestampData].sort();

            const expectedIntervalMs = 15 * 60 * 1000; // 15 นาที ในหน่วยมิลลิวินาที
            const gaps = [];

            for (let i = 1; i < sortedData.length; i++) {
                const prevTime = parseDate(sortedData[i - 1]);
                const currTime = parseDate(sortedData[i]);

                if (!prevTime || !currTime) continue;

                const diffMs = currTime.getTime() - prevTime.getTime();
                const expectedIntervalsInGap = Math.round(diffMs / expectedIntervalMs) - 1;

                if (expectedIntervalsInGap > 0) {

                    let missingTime = new Date(prevTime.getTime() + expectedIntervalMs);

                    for (let j = 0; j < expectedIntervalsInGap; j++) {
                        gaps.push(formatDate(missingTime));

                        // เลื่อนไปยังเวลาถัดไป (เพิ่มอีก 15 นาที)
                        missingTime.setTime(missingTime.getTime() + expectedIntervalMs);
                    }
                }
            }

            return gaps;
        }

        /**
 * แปลงจำนวน Interval เป็นข้อความที่แสดง วัน ชั่วโมง นาที (โดย 1 Interval = 15 นาที)
 * @param {number} intervals - จำนวน Interval ที่ต้องการแปลง
 * @param {number} minutesPerInterval - นาทีต่อ Interval (ค่าเริ่มต้นคือ 15)
 * @returns {string} ข้อความในรูปแบบ "X วัน Y ชม. Z นาที"
 */
        function formatIntervals(intervals, minutesPerInterval = 15) {
            //
            if (intervals === null || intervals === undefined || typeof intervals !== 'number' || intervals < 0) {
                return '0 นาที';
            }
            const totalMinutes = intervals * minutesPerInterval;
            const minutesInDay = 1440; // 24 * 60

            const days = Math.floor(totalMinutes / minutesInDay);
            const minutesAfterDays = totalMinutes % minutesInDay;

            const hours = Math.floor(minutesAfterDays / 60);
            const minutes = minutesAfterDays % 60;

            let result = '';
            if (days > 0) {
                result += `${days} วัน `;
            }
            if (hours > 0 || days > 0) {
                result += `${hours} ชม. `;
            }
            // แสดงนาทีเสมอ
            result += `${minutes} นาที`;

            return result.trim();
        }

        // ฟังก์ชัน exportTableToExcel() ฉบับปรับตำแหน่งคอลัมน์ใหม่
        // ****************************************************************
        function exportTableToExcel() {
            if (!isProcessed) {
                alert("กรุณาอัปโหลดไฟล์ Excel ก่อนทำการส่งออก");
                return;
            }

            // ดึงค่าที่เลือกจาก UI (ไม่มีการเปลี่ยนแปลง)
            const unitType = document.getElementById('unitSelector').value;
            const applyMultiplier = document.getElementById('applyMultiplier').checked;
            const selectedDataType = document.getElementById('dataTypeSelector').value;
            const selectedMonthYear = document.getElementById('monthYearSelector').value;
            const selectedArType = document.getElementById('arTypeSelector').value;
            let whUnit, varhUnit;
            let whCalculation, varhCalculation;
            let decimalPlaces;

            // การกำหนดหน่วยและการคำนวณสำหรับตารางละเอียด (ไม่มีการเปลี่ยนแปลง)
            if (unitType === 'kw_kvar') {
                whUnit = 'kW';
                varhUnit = 'kVar';
                decimalPlaces = 3;
                whCalculation = (wh_val_raw, mult) => {
                    const roundedWhTimesFour = Math.round(parseFloat(wh_val_raw) * 4);
                    return customRound((roundedWhTimesFour * mult / 1000), decimalPlaces);
                };
                varhCalculation = (varh_val_raw, mult) => {
                    const roundedVarhTimesFour = Math.round(parseFloat(varh_val_raw) * 4);
                    return customRound((roundedVarhTimesFour * mult / 1000), decimalPlaces);
                };
            } else {
                whUnit = selectedDataType === 'wh_import' ? 'Wh Import' : 'Wh Export';
                varhUnit = 'Varh';
                decimalPlaces = 5;
                whCalculation = (wh_val_raw, mult) => {
                    return customRound((parseFloat(wh_val_raw) * mult), decimalPlaces);
                };
                varhCalculation = (varh_val_raw, mult) => {
                    return customRound((parseFloat(varh_val_raw) * mult), decimalPlaces);
                };
            }

            // 1. เตรียมข้อมูลสำหรับ sheet "Electric Rates Filtered" (ไม่มีการเปลี่ยนแปลง)
            let dataToExport = [
                ['Datetime', 'Rate', `${whUnit}`, `${varhUnit}`, 'Multiplier']
            ];

            let filteredResults = [];
            if (selectedMonthYear === 'all') {
                filteredResults = globalResults;
            } else {
                const [yearStr, monthStr] = selectedMonthYear.split('-');
                const selectedMonthInt = parseInt(monthStr);
                const selectedYearInt = parseInt(yearStr);
                filteredResults = globalResults.filter(r => {
                    return isInBillingPeriod(r.dateObject, selectedArType, selectedMonthInt, selectedYearInt);
                });
            }

            const dataToRender = [...filteredResults];

            dataToRender.forEach(r => {
                const rawWh = selectedDataType === 'wh_import' ? r.originalWhImportValue : r.originalWhExportValue;
                const rawVarh = r.originalVarhValue || 0;
                const currentMultiplier = applyMultiplier ? r.rowMultiplier : 1;
                const calculatedWh = whCalculation(rawWh, currentMultiplier);
                const calculatedVarh = varhCalculation(rawVarh, currentMultiplier);

                dataToExport.push([
                    r.datetime,
                    getRate(r.dateObject),
                    calculatedWh.toFixed(decimalPlaces),
                    calculatedVarh.toFixed(decimalPlaces),
                    currentMultiplier.toFixed(5)
                ]);
            });


            // 2. สร้างข้อมูลสำหรับ TOU Sheet (สรุปรายเดือน)
            const touData = [
                // ✅ หัวตารางใหม่: B=Interval | C=Day Count | D=ระยะเวลา | E=Datetime เริ่ม | F=Datetime สิ้นสุด
                ['เดือน/ปี', 'Interval (Actual / Expect)', 'Day Count (Actual / Expect)', 'ระยะเวลา (วัน ชม. นาที)', 'ช่วงเวลาเริ่มต้น LP (ค่าแรก)', 'ช่วงเวลาสิ้นสุด LP (ค่าสุดท้าย)', `${whUnit} (รวม)`, `${whUnit} (Peak)`, `${whUnit} (Off-peak)`, `${whUnit} (Holiday)`, 'kW Max (Peak)', 'kW Max (Off-peak)', 'kW Max (Holiday)', 'kVar Max (รวมทุกเรท)'],
            ];

            const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            const sortedMonthKeys = Object.keys(monthlySummaries).sort((a, b) => {
                const [yearA, monthA] = a.split('-').map(Number);
                const [yearB, monthB] = b.split('-').map(Number);
                if (yearA !== yearB) return yearA - yearB;
                return monthA - monthB;
            });

            const decimalPlacesForKwhSummary = 2;
            const decimalPlacesForKwSummary = 3;

            sortedMonthKeys.forEach(monthKey => {
                const [yearStr, monthStr] = monthKey.split('-');
                const year = parseInt(yearStr);

                // ---------------------------------------------------------

                // ---------------------------------------------------------
                const selectedMonthInt = parseInt(monthStr);

                let firstRecordDatetime = 'N/A';

                // ---------------------------------------------------------
                // คำนวณค่า kWh/kW (ไม่มีการเปลี่ยนแปลง)
                // ---------------------------------------------------------

                const displayTotalWhMonth = customRound(((summary['Peak'].wh + summary['Off-peak'].wh + summary['Holiday'].wh) / 1000), decimalPlacesForKwhSummary);
                const displayPeakWh = customRound((summary['Peak'].wh / 1000), decimalPlacesForKwhSummary);
                const displayOffPeakWh = customRound((summary['Off-peak'].wh / 1000), decimalPlacesForKwhSummary);
                const displayHolidayWh = customRound((summary['Holiday'].wh / 1000), decimalPlacesForKwhSummary);

                const displayPeakKw = customRound(maxes['Peak'].wh, decimalPlacesForKwSummary);
                const displayOffPeakKw = customRound(maxes['Off-peak'].wh, decimalPlacesForKwSummary);
                const displayHolidayKw = customRound(maxes['Holiday'].wh, decimalPlacesForKwSummary);

                let baseMaxKvarMonthOverall = 0;
                ['Peak', 'Off-peak', 'Holiday'].forEach(rate => {
                    if (maxes[rate].varh > baseMaxKvarMonthOverall) {
                        baseMaxKvarMonthOverall = maxes[rate].varh;

                });
                const displayMaxKvarMonthOverall = customRound(baseMaxKvarMonthOverall, decimalPlacesForKwSummary);

                // -------------------------------------------------------------
                // ลอจิกสำหรับการเตรียมข้อมูล Interval (สำหรับ Col B, C, D)
                // -------------------------------------------------------------
                let actualIntervals = 0;
                let expectedIntervalsInBillingPeriod = 0;
                let dayCountString = '0 / 0';
                let formattedActualTime = '0 นาที';
                let formattedIntervalString = '0 / 0';

                if (intervalData && intervalData.interval) {
                    const parts = intervalData.interval.split('/');
                    actualIntervals = parseInt(parts[0].trim());
                    expectedIntervalsInBillingPeriod = parseInt(parts[1].trim());

                    // Col B: Interval (Actual / Expect)
                    formattedIntervalString = `${actualIntervals} / ${expectedIntervalsInBillingPeriod}`;

                    // Col C: Day Count (Actual / Expect)
                    dayCountString = intervalData.dayCount;

                // -------------------------------------------------------------
                // ✅ PUSH DATA: จัดเรียงคอลัมน์ใหม่ตามที่ร้องขอ
                // -------------------------------------------------------------
                touData.push([
                    `${monthName} ${year + 543}`,                  // Col A: เดือน/ปี
                    formattedIntervalString,                       // Col B: Interval (Actual / Expect) 
                    dayCountString,                                // Col C: Day Count (Actual / Expect) 
                    formattedActualTime,                           // Col D: ระยะเวลา (วัน ชม. นาที) (NEW POSITION)
                    firstRecordDatetime,                           // Col E: ค่าแรกจาก filtered data
                    lastRecordDatetime,                            // Col F: ค่าสุดท้ายจาก filtered data

                    // Col G เป็นต้นไป: ข้อมูล kWh/kW เดิม
                    displayTotalWhMonth.toFixed(decimalPlacesForKwhSummary),
                    displayPeakWh.toFixed(decimalPlacesForKwhSummary),
                    displayOffPeakWh.toFixed(decimalPlacesForKwhSummary),
                    displayHolidayWh.toFixed(decimalPlacesForKwhSummary),
                    displayPeakKw.toFixed(decimalPlacesForKwSummary),
                    displayOffPeakKw.toFixed(decimalPlacesForKwSummary),
                    displayHolidayKw.toFixed(decimalPlacesForKwSummary),
                    displayMaxKvarMonthOverall.toFixed(decimalPlacesForKwSummary)
                ]);
            });


            // 3. สร้าง Workbook และส่งออกไฟล์ (ไม่มีการเปลี่ยนแปลง)
            const wb = XLSX.utils.book_new();
            const wsTOU = XLSX.utils.aoa_to_sheet(touData);
            XLSX.utils.book_append_sheet(wb, wsTOU, "TOU");

            const ws = XLSX.utils.aoa_to_sheet(dataToExport);
            XLSX.utils.book_append_sheet(wb, ws, "Electric Rates Filtered");

            const now = new Date();
            const filename = `${meterNumber || "N_A"}_${now.getDate()}-${now.getMonth() +
                1}-${now.getFullYear()}_${now.getHours()}${now.getMinutes()}${now.getSeconds()}.xlsx`;

            XLSX.writeFile(wb, filename);
        }


        document.getElementById('exportExcel').addEventListener('click', exportTableToExcel);

        function updateExportButtonVisibility() {
            const exportButton = document.getElementById('exportExcel');
            if (isProcessed && globalResults.length > 0) {
                exportButton.style.display = 'block';
            } else {
                exportButton.style.display = 'none';
            }
        }
        document.addEventListener('DOMContentLoaded', updateExportButtonVisibility);

        // =========================================================
        // Constants (Header Definitions)
        // =========================================================
        const CUSTOMER_HEADERS_TEMPLATE = [
            'METERPOINTID', 'AREA', 'CUSTOMERCODE', 'CA', 'PEA NO', 'CUSTOMER NAME',
            'ADDRESS', 'PHONE NUMBER', 'FAX NUMBER', 'CONTACT NAME', 'EMAIL',
            'WEB SITE', 'RATE CODE', 'RATE', 'TARIFF', 'INDUSTRIAL SECTION',
            'TSIC', 'CT, VT', 'KVA', 'BIILING RESET', 'VSPP'
        ];

        const LP_HEADERS_ROW3 = [
            'METERPEA', 'METERPOINTID', 'DATE_M', 'Load Profile Status',
            'CTP', 'CTS', 'VTP', 'VTS',
            'VOLTA', 'VOLTB', 'VOLTC',
            'AMPSA', 'AMPSB', 'AMPSC',
            'THDVA', 'THDVB', 'THDVC',
            'THDIA', 'THDIB', 'THDIC',
            'ANGLE A', 'ANGLE B', 'ANGLE C',
            'WHIMP A', 'WHIMP B', 'WHIMP C', 'WHIMP Total',
            'WHEXP A', 'WHEXP B', 'WHEXP C', 'WHEXP Total',
            'VARHIMP A', 'VARHIMP B', 'VARHIMP C', 'VARHIMP Total',
            'VARHEXP A', 'VARHEXP B', 'VARHEXP C', 'VARHEXP Total',
            'PF T'
        ];

        const MINI_LP_HEADERS = ['DATE_M', 'WH', 'VARHIMP Total'];

        // ฟังก์ชันช่วยในการตั้งค่า Header ที่มีการ Merge และใส่ Border (Row 2)
        function setMergedHeader(lpSheet, label, startCol, endCol) {
            lpSheet.mergeCells(2, startCol, 2, endCol);
            const cell = lpSheet.getRow(2).getCell(startCol);
            cell.value = label;
            cell.font = { bold: true };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };

            for (let c = startCol; c <= endCol; c++) {
                lpSheet.getRow(2).getCell(c).border = {
                    top: { style: 'thin' }, left: { style: 'thin' },
                    bottom: { style: 'thin' }, right: { style: 'thin' }
                };
            }
        }

        const defaultThinBorder = {
            top: { style: 'thin' }, left: { style: 'thin' },
            bottom: { style: 'thin' }, right: { style: 'thin' }
        };
        const headerFillStyle = {
            font: { bold: true, color: { argb: "FFFFFFFF" } },
            fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0070C0' } }, // สีพื้นหลัง: น้ำเงิน
            alignment: { horizontal: 'center', vertical: 'middle' }
        };

        // =========================================================
        // 1. ฟังก์ชันสำหรับ FULL TEMPLATE (40 คอลัมน์ + Customer Info)
        // =========================================================
        async function exportFullTemplate(e) {
            e.preventDefault(); // ป้องกันการเปลี่ยนหน้าของ A Tag
            const workbook = new ExcelJS.Workbook();
            const totalCols = LP_HEADERS_ROW3.length;
            const filename = `Electric_Data_Template_Full_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.xlsx`;

            // --- Load Profile Sheet (Sheet 1) ---
            const lpSheet = workbook.addWorksheet('Load Profile');

            // Row 1: Title (Merge A1:AN1)
            lpSheet.mergeCells(1, 1, 1, totalCols);
            const titleCell = lpSheet.getCell('A1');
            titleCell.value = 'DATA FROM METER';
            titleCell.font = { bold: true, size: 14 };
            titleCell.alignment = { horizontal: 'center', vertical: 'middle' };

            // Row 2: Merged Group Headers 
            setMergedHeader(lpSheet, 'CT', 5, 6);
            setMergedHeader(lpSheet, 'VT', 7, 8);
            setMergedHeader(lpSheet, 'VOLTAGE', 9, 11);
            setMergedHeader(lpSheet, 'CURRENT', 12, 14);
            setMergedHeader(lpSheet, 'VOLTAGE THD', 15, 17);
            setMergedHeader(lpSheet, 'CURRENT THD', 18, 20);
            setMergedHeader(lpSheet, 'ANGLE', 21, 23);
            setMergedHeader(lpSheet, 'WATT-HOUR IMP', 24, 27);
            setMergedHeader(lpSheet, 'WATT-HOUR EXP', 28, 31);
            setMergedHeader(lpSheet, 'VAR-HOUR IMP', 32, 35);
            setMergedHeader(lpSheet, 'VAR-HOUR EXP', 36, 39);
            setMergedHeader(lpSheet, 'POWER FACTOR', 40, 40);

            // Row 3: Detail Headers (ใส่สีพื้นหลังและเส้นตาราง)
            lpSheet.getRow(3).values = LP_HEADERS_ROW3;
            lpSheet.getRow(3).eachCell(cell => {
                Object.assign(cell, headerFillStyle);
                cell.border = defaultThinBorder;
            });

            // เพิ่มแถวข้อมูลเปล่า 1 แถว + ใส่เส้นตาราง
            const exampleRow = Array(totalCols).fill('');
            exampleRow[2] = 'YYYY/MM/DD HH:MM:SS';
            lpSheet.addRow(exampleRow);
            lpSheet.getRow(4).eachCell(cell => {
                cell.border = defaultThinBorder;
            });
            lpSheet.getColumn(3).numFmt = 'yyyy/mm/dd hh:mm';
            lpSheet.columns.forEach(col => { col.width = 15; });


            // --- Customer Info Sheet (Sheet 2) ---
            const customerSheet = workbook.addWorksheet('Customer Info');
            customerSheet.addRow(['Key', 'Value']);
            const headerRow = customerSheet.getRow(1);
            Object.assign(headerRow.eachCell, headerFillStyle);
            headerRow.eachCell(cell => {
                cell.border = defaultThinBorder;
            });

            CUSTOMER_HEADERS_TEMPLATE.forEach(header => { customerSheet.addRow([header, '']); });
            for (let r = 2; r <= CUSTOMER_HEADERS_TEMPLATE.length + 1; r++) {
                customerSheet.getRow(r).eachCell(cell => { cell.border = defaultThinBorder; });
            }
            customerSheet.columns.forEach(col => { col.width = 25; });

            // --- Download ---
            await downloadExcel(workbook, filename);
        }

        // =========================================================
        // 2. ฟังก์ชันสำหรับ MINI TEMPLATE (3 คอลัมน์)
        // =========================================================
        async function exportMiniTemplate(e) {
            e.preventDefault();
            const workbook = new ExcelJS.Workbook();
            const miniCols = MINI_LP_HEADERS.length; // 3 columns
            const filename = `Electric_Data_Template_Mini_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.xlsx`;

            // --- Mini Load Profile Sheet (Sheet 1) ---
            const lpSheet = workbook.addWorksheet('Mini Load Profile');

            // Row 1: Headers (ใช้ MINI_LP_HEADERS)
            lpSheet.addRow(MINI_LP_HEADERS);

            // Apply styling to Row 1 (Header)
            lpSheet.getRow(1).eachCell(cell => {
                // ใช้ Object.assign เพื่อรวมสไตล์ Header Fill (สีน้ำเงิน)
                Object.assign(cell, headerFillStyle);
                cell.border = defaultThinBorder;
            });

            // Row 2: Example Data (Value)
            lpSheet.addRow(['YYYY/MM/DD HH:MM:SS', '', '']);

            // ใส่เส้นตารางให้ Row 2
            lpSheet.getRow(2).eachCell(cell => { cell.border = defaultThinBorder; });

            // กำหนด Format วันที่ (Column 1)
            lpSheet.getColumn(1).numFmt = 'yyyy/mm/dd hh:mm';

            // Set Column Widths
            lpSheet.columns.forEach(col => { col.width = 20; });

            // --- Download ---
            await downloadExcel(workbook, filename);
        }

        // =========================================================
        // 3. ฟังก์ชัน Download กลาง
        // =========================================================
        async function downloadExcel(workbook, filename) {
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            URL.revokeObjectURL(url);
            console.log(`✅ Excel Template exported successfully: ${filename}`);
        }

        // =========================================================
        // 4. Attach Listeners (เชื่อมต่อกับ A Tag ใหม่)
        // =========================================================
        document.getElementById('exportFullTemplate').addEventListener('click', exportFullTemplate);
        document.getElementById('exportMiniTemplate').addEventListener('click', exportMiniTemplate);

        // =========================================================
        // 5. Scroll Down Logic (เปลี่ยนปุ่มเป็นสัญลักษณ์)
        // =========================================================
        const floatingDropdown = document.querySelector('.floating-dropdown');
        const scrollThreshold = 50; // กำหนดระยะเลื่อน (เป็นพิกเซล) ที่ต้องการให้เปลี่ยนเป็นสัญลักษณ์

        window.addEventListener('scroll', () => {
            if (window.scrollY > scrollThreshold) {
                // เลื่อนลงเกิน threshold, เปลี่ยนเป็นแบบสัญลักษณ์เท่านั้น
                floatingDropdown.classList.add('scrolled');
            } else {
                // อยู่ด้านบน, เปลี่ยนกลับเป็นแบบเต็ม
                floatingDropdown.classList.remove('scrolled');
            }
        });

        // ========================================================= SNOWFLAKE EFFECT

        function createSnowflake() {
            const snow = document.createElement("div");
            snow.classList.add("snowflake");
            snow.textContent = "❄";

            // random position
            snow.style.left = Math.random() * 100 + "vw";
            snow.style.fontSize = (Math.random() * 10 + 10) + "px";
            snow.style.opacity = Math.random();
            snow.style.animationDuration = (Math.random() * 5 + 5) + "s";

            document.body.appendChild(snow);

            // remove when finished
            setTimeout(() => {
                snow.remove();
            }, 10000);
        }

        // generate snowflakes
        setInterval(createSnowflake, 150);

    </script>
